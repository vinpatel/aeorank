name: "AEOrank — AEO Scanner"
description: "Scan any URL for AI Engine Optimization (AEO) score. Posts results as a GitHub Check and PR comment."
author: "AEOrank"

branding:
  icon: "bar-chart-2"
  color: "blue"

inputs:
  url:
    description: "URL to scan"
    required: true
  token:
    description: "GitHub token for API calls"
    required: false
    default: ${{ github.token }}
  fail-below:
    description: "Fail the Check if AEO score drops below this value (0 = never fail)"
    required: false
    default: "0"
  fail-on-crawler-block:
    description: "Fail the Check if GPTBot, ClaudeBot, PerplexityBot, or Google-Extended is disallowed in robots.txt (fail the PR if GPTBot is blocked). Missing robots.txt is unknown, not blocked."
    required: false
    default: "true"

runs:
  using: "composite"
  steps:
    - name: Run AEOrank scan
      id: scan
      shell: bash
      run: |
        RESULT=$(npx aeorank-cli@latest scan "${{ inputs.url }}" --format json --no-files 2>/dev/null)
        echo "result<<AEORANK_EOF" >> $GITHUB_OUTPUT
        echo "$RESULT" >> $GITHUB_OUTPUT
        echo "AEORANK_EOF" >> $GITHUB_OUTPUT
        # Extract score for quick access
        SCORE=$(echo "$RESULT" | node -e "const d=require('fs').readFileSync('/dev/stdin','utf8');console.log(JSON.parse(d).score)")
        echo "score=$SCORE" >> $GITHUB_OUTPUT
        GRADE=$(echo "$RESULT" | node -e "const d=require('fs').readFileSync('/dev/stdin','utf8');console.log(JSON.parse(d).grade)")
        echo "grade=$GRADE" >> $GITHUB_OUTPUT

    - name: Post Check Run
      uses: actions/github-script@v8
      env:
        SCAN_RESULT: ${{ steps.scan.outputs.result }}
        FAIL_BELOW: ${{ inputs.fail-below }}
        FAIL_ON_CRAWLER_BLOCK: ${{ inputs.fail-on-crawler-block }}
      with:
        github-token: ${{ inputs.token }}
        script: |
          const result = JSON.parse(process.env.SCAN_RESULT);
          const failBelow = parseInt(process.env.FAIL_BELOW, 10);
          const failOnCrawlerBlock = String(process.env.FAIL_ON_CRAWLER_BLOCK).toLowerCase() !== 'false';
          const { score, grade, url, dimensions } = result;
          const crawlerAccess = result.crawlerAccess || result.meta?.robotsTxt?.crawlerAccess || {};
          const crawlerGate = result.crawlerGate || {};
          const blockedBots = Array.isArray(crawlerGate.blockedBots) ? crawlerGate.blockedBots : [];
          const crawlerFailed = failOnCrawlerBlock && (crawlerGate.failed === true || blockedBots.length > 0);

          // Crawler table leads the Check / PR comment
          const crawlerRows = ['GPTBot', 'ClaudeBot', 'PerplexityBot', 'Google-Extended'].map(bot => {
            const raw = crawlerAccess[bot] || 'unknown';
            const status = raw === 'allowed' ? 'allow' : raw === 'disallowed' ? 'block' : raw;
            return `| ${bot} | ${status} |`;
          });
          const crawlerNote = crawlerGate.robotsTxt === 'missing'
            ? '_robots.txt missing — status **unknown** (not treated as blocked)._\n\n'
            : '';
          const blockedNote = blockedBots.length
            ? `\n**Blocked:** ${blockedBots.join(', ')}\n`
            : '';
          const crawlerTable = [
            '### AI Crawler Access',
            '',
            crawlerNote + '| Bot | Status |',
            '|-----|--------|',
            ...crawlerRows,
            blockedNote
          ].join('\n');

          // Build dimension table markdown
          const statusEmoji = { pass: '✅', warn: '⚠️', fail: '❌' };
          const rows = dimensions.map(d =>
            `| ${d.name} | ${d.score}/${d.maxScore} | ${statusEmoji[d.status]} ${d.status.toUpperCase()} | ${d.hint} |`
          );
          const table = [
            crawlerTable,
            '',
            '| Dimension | Score | Status | Recommendation |',
            '|-----------|-------|--------|----------------|',
            ...rows
          ].join('\n');

          // Determine correct SHA (PR head, not merge commit)
          const sha = context.eventName === 'pull_request'
            ? context.payload.pull_request.head.sha
            : context.sha;

          // Determine Check conclusion — crawler block fails even when score is high
          let conclusion;
          let title = `AEO Score: ${score}/100 (${grade})`;
          let summary = `Your site scored **${score}** — Grade **${grade}** | Scanned: ${url}`;
          if (crawlerFailed) {
            conclusion = 'failure';
            const names = blockedBots.join(', ') || 'an AI crawler';
            title = `${names} blocked in robots.txt`;
            summary = `${names} ${blockedBots.length === 1 ? 'is' : 'are'} blocked in robots.txt. The AEOrank check fails when GPTBot, ClaudeBot, PerplexityBot, or Google-Extended is disallowed — even if the overall score is high. Score: ${score}/100 (${grade}).`;
          } else if (failBelow > 0 && score < failBelow) {
            conclusion = 'failure';
          } else if (score >= 70) {
            conclusion = 'success';
          } else if (score >= 40) {
            conclusion = 'neutral';
          } else {
            conclusion = 'failure';
          }

          // Post Check Run
          await github.rest.checks.create({
            owner: context.repo.owner,
            repo: context.repo.repo,
            head_sha: sha,
            name: 'AEOrank Score',
            status: 'completed',
            conclusion: conclusion,
            output: {
              title: title,
              summary: summary,
              text: table,
            }
          });

          // Export table for PR comment step
          core.exportVariable('AEORANK_TABLE', table);

    - name: Find existing PR comment
      if: ${{ github.event_name == 'pull_request' }}
      id: fc
      uses: peter-evans/find-comment@v3
      with:
        token: ${{ inputs.token }}
        issue-number: ${{ github.event.pull_request.number }}
        comment-author: "github-actions[bot]"
        body-includes: "<!-- aeorank-score -->"

    - name: Upsert PR comment
      if: ${{ github.event_name == 'pull_request' }}
      uses: peter-evans/create-or-update-comment@v5
      with:
        token: ${{ inputs.token }}
        comment-id: ${{ steps.fc.outputs.comment-id }}
        issue-number: ${{ github.event.pull_request.number }}
        edit-mode: replace
        body: |
          <!-- aeorank-score -->
          ## AEOrank Score: ${{ steps.scan.outputs.score }}/100 (${{ steps.scan.outputs.grade }})

          ${{ env.AEORANK_TABLE }}

          *Scanned ${{ inputs.url }} · [What is AEOrank?](https://aeorank.dev)*
