name: test

on:
  pull_request:
  push:
    branches: [main]

jobs:
  core-and-cli:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.32.1
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @aeorank/core test
      - run: pnpm --filter @aeorank/core build
      - run: pnpm --filter aeorank-cli test
